[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aisbench-runner"
version = "0.1.0"
description = "GPUStack benchmark runner that measures with aisbench"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

[project.scripts]
benchmark-runner = "aisbench_runner.cli:entrypoint"

[tool.setuptools]
packages = ["aisbench_runner"]
